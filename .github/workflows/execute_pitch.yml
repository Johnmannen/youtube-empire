name: Execute Video Pitch From Dashboard

on:
  repository_dispatch:
    types: [execute_pitch]
  workflow_dispatch:
    inputs:
      pitch_id:
        description: 'Pitch ID to produce (e.g. 005)'
        required: true
        default: '005'
      pitch_title:
        description: 'Title of the Pitch'
        required: false
        default: 'Turn Any Text Document into Audio Podcasts in Python'

permissions:
  contents: write

jobs:
  produce-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow

      - name: Register Pending Order
        id: order
        run: |
          PITCH_ID="${{ github.event.client_payload.pitch_id || github.event.inputs.pitch_id }}"
          PITCH_TITLE="${{ github.event.client_payload.title || github.event.inputs.pitch_title }}"
          echo "pitch_id=$PITCH_ID" >> $GITHUB_OUTPUT
          echo "pitch_title=$PITCH_TITLE" >> $GITHUB_OUTPUT
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python -c "
          import json
          order = {
              'pitch_id': '$PITCH_ID',
              'title': '$PITCH_TITLE',
              'status': 'BUILDING_IN_CLOUD',
              'requested_at': '$TIMESTAMP'
          }
          with open('docs/pending_order.json', 'w', encoding='utf-8') as f:
              json.dump(order, f, indent=2)
          "

      - name: Execute Video Production Engine
        run: |
          PITCH_ID="${{ steps.order.outputs.pitch_id }}"
          SCRIPT="scripts/produce_master_package_${PITCH_ID}.py"
          if [ -f "$SCRIPT" ]; then
            echo "Running dedicated master producer: $SCRIPT"
            python "$SCRIPT"
          else
            echo "Running fallback producer for $PITCH_ID"
            python .agents/skills/building-youtube-packages/scripts/produce_package.py --output docs/assets/
          fi

      - name: Update Dashboard & Archive Previous Episode
        run: |
          PITCH_ID="${{ steps.order.outputs.pitch_id }}"
          python scripts/auto_deploy_package.py --package-id "$PITCH_ID"

      - name: Run 20-Point Quality & Compliance Audit
        run: |
          PITCH_ID="${{ steps.order.outputs.pitch_id }}"
          python .agents/skills/quality_compliance_auditor/scripts/audit_package.py --package-id "$PITCH_ID" --dir docs/assets

      - name: Mark Order Completed & Push to Main
        run: |
          PITCH_ID="${{ steps.order.outputs.pitch_id }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python -c "
          import json
          with open('docs/pending_order.json', 'r', encoding='utf-8') as f:
              order = json.load(f)
          order['status'] = 'COMPLETED'
          order['completed_at'] = '$TIMESTAMP'
          with open('docs/pending_order.json', 'w', encoding='utf-8') as f:
              json.dump(order, f, indent=2)
          "
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(cloud-build): produced & audited Episode #${PITCH_ID} [skip ci]" && git push)
