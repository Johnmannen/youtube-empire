name: Channel Analytics 6-Hour Auto-Sync

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-channel-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-oauthlib google-auth

      - name: Write OAuth Token Secret
        if: "${{ env.YT_TOKEN_JSON != '' }}"
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          echo "$YT_TOKEN_JSON" > token.json

      - name: Fetch Live YouTube Metrics & Update Dashboard
        run: |
          python scripts/sync_dashboard_metrics.py

      - name: Clean up Credentials
        if: always()
        run: |
          rm -f token.json client_secret.json

      - name: Commit and Push Updated Dashboard State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(analytics): auto-sync channel metrics via YouTube API [skip ci]" && git push)
