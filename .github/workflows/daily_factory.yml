name: YouTube Factory Autonomous Production Pipeline

on:
  schedule:
    # Runs at 04:00 UTC on Mondays, Wednesdays, and Fridays (3 videos/week)
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts pillow matplotlib google-api-python-client google-auth-oauthlib

      - name: Execute Autonomous Video Production
        run: |
          python .agents/skills/building-youtube-packages/scripts/produce_package.py --output docs/assets/

      - name: Commit and Push Updated Assets & Dashboard
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(factory): autonomous video package generated [skip ci]" && git push)
